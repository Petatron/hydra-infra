name: Manage K8s Worker Nodes

# NO push trigger, deliberately. See ADR-002 (single-writer worker lifecycle).
#
# This workflow used to run `sync-nodes.sh apply` -- which creates, joins and
# destroys worker VMs -- automatically on every push to main that touched
# main.tf, variables.tf, terraform.tfvars or templates/. That is an unattended
# mutation of machine lifecycle, and Cluster API is taking that job over.
#
# Two systems reconciling the same worker fleet is the split-brain this repo
# must not create. Removing the trigger costs nothing today: Terraform has never
# actually run against this infrastructure (no state file anywhere, no terraform
# binary on the host), and nothing on the hypervisor was created by it.
#
# Applying is still possible -- deliberately, by a human, via workflow_dispatch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_IN_AUTOMATION: "true"
  SSH_KEY: "/home/yibofu/.ssh/id_ed25519"
  KUBECONFIG: "/home/yibofu/.kube/config"
  CONTROL_PLANE_IP: "192.168.15.10"

jobs:
  # ---------- Plan (PRs + manual "plan") ----------
  plan:
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Plan
        run: terraform plan -no-color

  # ---------- Apply (manual "apply" ONLY -- never automatic) ----------
  apply:
    if: github.event.inputs.action == 'apply'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Nodes (plan + apply + join)
        run: ./scripts/sync-nodes.sh apply

  # ---------- Destroy (manual only) ----------
  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Destroy All Nodes
        run: ./scripts/sync-nodes.sh destroy
